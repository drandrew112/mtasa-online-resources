<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EMS Unit Tablet</title>
    <link rel="stylesheet" href="/web_api/osa.css">
    <link rel="stylesheet" href="css/erm.css">
</head>
<body class="locked mode-tablet">
    <div class="osa-login" id="login">
        <div class="osa-login-stack">
            <form class="osa-login-box" id="tabletLoginForm" autocomplete="off">
                <span class="logo big"><i></i><i></i></span>
                <h1>EMS Unit Tablet</h1>
                <p>Sign in with your game account</p>
                <input id="tabletUser" class="plain" type="text" placeholder="Username" maxlength="64" autocomplete="username">
                <input id="tabletPass" class="plain" type="password" placeholder="Password" maxlength="128" autocomplete="current-password">
                <div class="osa-login-error" id="tabletLoginError"></div>
                <button class="osa-btn primary" type="submit" id="tabletLoginBtn">Sign in</button>
            </form>

            <a class="home-link" data-goto="index" href="/med_web/">&lsaquo; San Andreas EMS</a>
        </div>
    </div>

    <div id="tabletApp" class="tablet-app">
        <header class="osa-topbar">
            <a class="osa-brand" data-goto="index" href="/med_web/" title="San Andreas EMS home">
                <span class="logo"><i></i><i></i></span>
                <div>
                    <strong id="tbTitle">EMS Unit Tablet</strong>
                    <small id="tbSub">Emergency Response Manager</small>
                </div>
            </a>
            <nav class="osa-tabs tb-nav" id="tbNav">
                <button class="osa-tab active" data-page="home">Home</button>
                <button class="osa-tab" data-page="case">Active Case</button>
                <button class="osa-tab" data-page="messages">Messages <b id="tbUnread" hidden>0</b></button>
            </nav>
            <div class="osa-top-right">
                <span class="who" id="tbWho"></span>
                <button class="osa-btn small" id="tbEndShift" hidden>End shift</button>
                <button class="osa-btn small" id="tbLogout">Sign out</button>
                <span class="osa-conn" id="tbConn" title="Connection"></span>
                <span class="osa-clock" id="tbClock">--:--:--</span>
            </div>
        </header>
        <main class="tb-main">
            <section class="tb-page" id="tbNoUnit" hidden>
                <div class="tb-empty">
                    <h2>You are not a member of any ambulance unit.</h2>
                    <p>Sign in to a unit on the tablet inside an ambulance. This page follows your unit automatically.</p>
                </div>
            </section>
            <section class="tb-page" id="tbHome" hidden></section>
            <section class="tb-page" id="tbCase" hidden></section>
            <section class="tb-page" id="tbMessages" hidden>
                <div class="osa-panel tb-chat">
                    <div class="osa-panel-head">
                        <div class="osa-tabs" id="tbChanTabs">
                            <button class="osa-tab active" data-chan="dispatch">Dispatch <b hidden>0</b></button>
                            <button class="osa-tab" data-chan="case">Case chat <b hidden>0</b></button>
                        </div>
                        <small class="osa-muted" id="tbChanInfo"></small>
                    </div>
                    <div class="chat-log" id="tbChatLog"></div>
                    <form class="chat-input" id="tbChatForm" autocomplete="off">
                        <input class="osa-input" id="tbChatText" maxlength="200" placeholder="Write a message to dispatch...">
                        <button class="osa-btn primary" type="submit">Send</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script src="/web_api/osa.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/tablet.js"></script>
</body>
</html>
