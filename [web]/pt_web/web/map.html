<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live railway map - San Andreas Transit</title>
    <link rel="stylesheet" href="/web_api/osa.css">
    <link rel="stylesheet" href="css/pt.css">
    <link rel="stylesheet" href="css/map.css">
</head>
<body class="pt-app">
    <header class="osa-topbar pt-top">
        <a class="pt-brand" data-goto="index">
            <svg class="pt-logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="10" fill="var(--pt-accent)"/><path d="M11 13h18M20 13v14" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="20" cy="29.5" r="3.6" fill="var(--sun)"/></svg>
            <span><b>San Andreas Transit</b><small>Sunline Rail live map</small></span>
        </a>
        <nav class="pt-nav">
            <a data-goto="index" data-hash="plan">Journey planner</a>
            <a data-goto="index" data-hash="departures">Departures</a>
            <a data-goto="index" data-hash="network">Network</a>
            <a data-goto="map" class="on">Live map</a>
            <a data-goto="index" data-hash="careers">Work with us</a>
        </nav>
        <div class="osa-kpis">
            <div class="osa-kpi"><span id="statTrains">0</span><label>trains</label></div>
            <div class="osa-kpi"><span id="statService">0</span><label>in service</label></div>
            <div class="osa-kpi"><span id="statPunct">-</span><label>avg delay</label></div>
        </div>
        <div class="pt-clock" id="clock">--:--</div>
    </header>

    <main class="layout">
        <aside class="boards left" id="trainPanel">
            <header class="board-head">
                <i class="tag grey" id="trainTag"></i>
                <div class="grow">
                    <h3 id="trainName">Trains</h3>
                    <div class="osa-muted" id="trainSub"></div>
                </div>
                <select class="osa-select" id="trainPick" title="Train"></select>
            </header>
            <section class="board-sec train-info">
                <h2>Train</h2>
                <div class="board-list osa-scroll" id="trainInfo"><p class="osa-muted">Loading...</p></div>
            </section>
            <section class="board-sec">
                <h2>Timetable</h2>
                <div class="board-list osa-scroll" id="trainStops"><p class="osa-muted">Loading...</p></div>
            </section>
            <section class="rw-legend">
                <div><i class="tag grey"></i> No timetable</div>
                <div><i class="tag green"></i> In service</div>
                <div><i class="dot st"></i> Station</div>
                <div><i class="dot sig"></i> Signal</div>
            </section>
        </aside>

        <section class="osa-map-wrap">
            <div id="map"></div>
            <div class="osa-offline" id="offline" hidden>Connection lost - retrying...</div>
        </section>

        <aside class="boards" id="boards">
            <header class="board-head">
                <div class="grow">
                    <h3 id="boardName">Stations</h3>
                    <div class="osa-muted" id="boardCity"></div>
                </div>
                <select class="osa-select" id="boardPick" title="Station"></select>
            </header>
            <section class="board-sec">
                <h2><span class="ico">&#x2197;</span> Departures</h2>
                <div class="board-list osa-scroll" id="depList"><p class="osa-muted">Loading...</p></div>
            </section>
            <section class="board-sec">
                <h2><span class="ico">&#x2198;</span> Arrivals</h2>
                <div class="board-list osa-scroll" id="arrList"><p class="osa-muted">Loading...</p></div>
            </section>
        </aside>
    </main>

    <script src="/web_api/osa.js"></script>
    <script src="js/common.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
