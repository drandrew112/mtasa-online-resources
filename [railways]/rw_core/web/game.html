<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sunline Rail - Network map</title>
    <style>html, body { margin: 0; background: #0b0f16; }</style>
</head>
<body>
<script>
// In-game entry of the network map (ui_browser). CEF caches the local files, so
// client/webpage.lua opens this page as game.html?v=<hash of the web files>; it loads
// index.html and its css / js under the same ?v=, so an updated resource never shows the old
// page. index.html itself stays plain for the HTTP page (web/http.html inlines its files).
(function () {
    'use strict';
    const v = (location.search.match(/[?&]v=(\w+)/) || [])[1] || String(Date.now());
    const q = '?v=' + v;
    fetch('index.html' + q).then(r => r.text()).then(html => {
        html = html.replace('href="css/style.css"', 'href="css/style.css' + q + '"')
                   .replace(/src="(js\/\w+\.js)"/g, 'src="$1' + q + '"');
        document.open();
        document.write(html);
        document.close();
    });
})();
</script>
</body>
</html>
