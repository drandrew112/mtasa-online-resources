<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OrgOS</title>
    <link rel="stylesheet" href="/web_api/osa.css">
    <link rel="stylesheet" href="css/orgos.css">
</head>
<body>
    <div class="os-screen">
        <aside class="os-side">
            <div class="os-brand"><b>OrgOS</b><small id="osPlace">–</small></div>
            <nav id="nav"></nav>
            <div class="os-side-foot">
                <div class="os-clock" id="clock">--:--</div>
                <button class="os-off" id="closeBtn" title="Close (Esc)">Shut down</button>
            </div>
        </aside>
        <main id="view" class="os-main"><div class="os-empty">Starting…</div></main>
    </div>
    <script src="/web_api/osa.js"></script>
    <script src="js/orgos.js"></script>
</body>
</html>
