<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380"><rect width="760" height="380" fill="#ffffff"/><rect x="640" y="184" width="100" height="12" fill="#9aa3b2"/><line x1="40" y1="190" x2="640" y2="190" stroke="#6b7486" stroke-dasharray="5 4"/><line x1="400" y1="190" x2="640" y2="190" stroke="#1f8a4c" stroke-width="3"/><path d="M530.0,190.0 L519.9,194.3 L519.9,185.7 Z" fill="#1f8a4c"/><path d="M400.0,183.0 L406.3,194.9 L393.7,194.9 Z" fill="#1f8a4c"/><text x="400.0" y="214.0" font-size="11" fill="#1f8a4c" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Roboto, Arial, sans-serif">final fix</text><text x="690.0" y="218.0" font-size="11" fill="#6b7486" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Roboto, Arial, sans-serif">runway</text><path d="M120,40 L300,40 Q400,40 400,180" fill="none" stroke="#1f5fc4" stroke-width="2.5"/><path d="M400.0,180.0 L396.1,170.8 L403.9,170.8 Z" fill="#1f5fc4"/><text x="120.0" y="30.0" font-size="12" fill="#1f5fc4" text-anchor="start" font-weight="bold" font-family="Segoe UI, Roboto, Arial, sans-serif">1  on a STAR: flies it to the final fix</text><line x1="60" y1="310" x2="250" y2="190" stroke="#d98a00" stroke-width="2.5"/><path d="M240.0,196.0 L234.3,204.2 L230.1,197.6 Z" fill="#d98a00"/><path d="M190,190 A60,60 0 0,0 199,221" fill="none" stroke="#d98a00"/><text x="178.0" y="216.0" font-size="11" fill="#d98a00" text-anchor="end" font-weight="bold" font-family="Segoe UI, Roboto, Arial, sans-serif">≤30°</text><text x="60.0" y="330.0" font-size="12" fill="#d98a00" text-anchor="start" font-weight="bold" font-family="Segoe UI, Roboto, Arial, sans-serif">2  heading that intercepts: keeps it and turns onto the final</text><path d="M560,340 L310,280 L400,198" fill="none" stroke="#c8343a" stroke-width="2.5" stroke-dasharray="8 4"/><path d="M318.0,283.0 L327.9,281.3 L326.1,288.9 Z" fill="#c8343a"/><path d="M397.0,202.0 L392.7,211.0 L387.5,205.2 Z" fill="#c8343a"/><circle cx="310" cy="280" r="4" fill="#c8343a"/><text x="302.0" y="284.0" font-size="11" fill="#c8343a" text-anchor="end" font-weight="normal" font-family="Segoe UI, Roboto, Arial, sans-serif">base point</text><text x="420.0" y="362.0" font-size="12" fill="#c8343a" text-anchor="start" font-weight="bold" font-family="Segoe UI, Roboto, Arial, sans-serif">3  anywhere else: direct to the nearest final fix</text><text x="420.0" y="376.0" font-size="11" fill="#c8343a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Roboto, Arial, sans-serif">(base point first when it is on the airport side)</text></svg>